# Compile l'application macOS sur un Mac de GitHub et crée le .dmg.
# - À chaque push sur main : vérifie que tout compile (le .dmg est
#   disponible dans l'onglet Actions, connecté à GitHub).
# - À chaque tag vX.Y.Z : publie le .dmg dans une Release publique.
name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Compilation
        run: flutter build macos --release

      - name: Création du .dmg
        run: scripts/creer_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MaBalance-dmg
          path: dist/MaBalance.dmg

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MaBalance.dmg
          generate_release_notes: true
